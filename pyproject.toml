[project]
name = "omnix"
version = "0.5.0"
description = "Open Multimodal Network for Immersive eXperiences (OMNIX) - Multimodal classroom learning package generator for educators"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IIT Madras / Commonwealth of Learning (COL)" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "litellm>=1.50.0",
    "kokoro-onnx>=0.3.0",
    "onnxruntime>=1.19.0",
    "soundfile>=0.12.0",
    "manim>=0.18.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

